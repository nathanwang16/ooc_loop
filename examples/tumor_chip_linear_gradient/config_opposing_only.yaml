# Recovery config — rerun ONLY the opposing topology after the NaN-poisoned
# constraint-GP crash on 2026-04-26.  Same parameters as config.yaml; only
# difference is `discrete_levels.inlet_topology = ["opposing"]`.

target_profile:
  kind: linear_gradient
  axis: y
  c_high: 1.0
  c_low: 0.0

continuous_bounds:
  W:
    min: 1500
    max: 4500
  d_p:
    min: 100
    max: 400
  s_p:
    min: 200
    max: 1000
  theta:
    min: 15
    max: 75
  Q_total:
    min: 5
    max: 200
  r_flow:
    min: 0.10
    max: 0.97
  delta_W:
    min: 0.12
    max: 0.48

optimization:
  n_sobol_init: 24
  n_bo_iterations: 176
  total_per_config: 200
  batch_size: 4
  max_concurrent_cfd: 8
  constraints:
    tau_mean_min: 0.1
    tau_mean_max: 2.0
    f_dead_max: 0.08
    Re_max: 100.0
    aspect_ratio_max: 15.0
  penalty_L2: 99.0
  penalty_cv_tau: 999.0

discrete_levels:
  pillar_config: ["none"]
  chamber_height: [200]
  inlet_topology: ["opposing"]

paths:
  template_case: "ooc_optimizer/cfd/template"
  stl_output_dir: "examples/tumor_chip_linear_gradient/data/stl"
  case_output_dir: "examples/tumor_chip_linear_gradient/data/cases"
  results_dir: "examples/tumor_chip_linear_gradient/data/results"
  evaluation_log: "examples/tumor_chip_linear_gradient/data/results/evaluations.jsonl"
  figures_dir: "examples/tumor_chip_linear_gradient/data/figures"
