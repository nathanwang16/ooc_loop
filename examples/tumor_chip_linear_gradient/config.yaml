# Example: inverse design against a linear concentration gradient.
#
# Inherits from configs/default_config.yaml and overrides target profile,
# bounds, and BO budget. Run 2 (single-topology, 120 evals) wedged W,
# r_flow, and delta_W against their upper bounds → bounds widened here so
# the optimum is interior, not boundary-pinned.
#
# All three inlet topologies are now swept; per-topology interpretability
# is run after BO and a comparison report is written next to results.

target_profile:
  kind: linear_gradient
  axis: x
  c_high: 1.0
  c_low: 0.0

# Search box widened above run-2's boundary-pinned optimum.  W: was 1200..3000
# (x*=2987 hit upper). r_flow: was 0.1..0.9 (x*=0.877 near upper). delta_W:
# was 0.12..0.40 (x*=0.35 near upper).  All three now have headroom on the
# upward side.  Lower bounds preserved so feasibility ratio doesn't collapse.
continuous_bounds:
  W:
    min: 1500
    max: 4500
  d_p:
    min: 100
    max: 400
  s_p:
    min: 200
    max: 1000
  theta:
    min: 15
    max: 75
  Q_total:
    min: 5
    max: 200
  r_flow:
    min: 0.10
    max: 0.97
  delta_W:
    min: 0.12
    max: 0.48

optimization:
  n_sobol_init: 24
  n_bo_iterations: 96
  total_per_config: 120
  batch_size: 4               # 4 concurrent CFD per BORunner
  max_concurrent_cfd: 8       # outer workers = 8 // 4 = 2 configs in parallel
  constraints:
    tau_mean_min: 0.1
    tau_mean_max: 2.0
    f_dead_max: 0.08
  penalty_L2: 99.0
  penalty_cv_tau: 999.0

# Sweep all three inlet topologies; pillar="none" and H=200 stay fixed
# so the BO budget concentrates on the topology comparison rather than
# the discrete pillar/height grid.  Per-topology budget = 120 evals;
# total = 3 × 120 = 360 forward solves.
discrete_levels:
  pillar_config: ["none"]
  chamber_height: [200]
  inlet_topology: ["opposing", "same_side_Y", "asymmetric_lumen"]

paths:
  template_case: "ooc_optimizer/cfd/template"
  stl_output_dir: "examples/tumor_chip_linear_gradient/data/stl"
  case_output_dir: "examples/tumor_chip_linear_gradient/data/cases"
  results_dir: "examples/tumor_chip_linear_gradient/data/results"
  evaluation_log: "examples/tumor_chip_linear_gradient/data/results/evaluations.jsonl"
  figures_dir: "examples/tumor_chip_linear_gradient/data/figures"
